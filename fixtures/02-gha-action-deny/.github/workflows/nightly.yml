name: nightly-deny
on:
  schedule:
    - cron: "0 2 * * *"
jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Review open issues"
          claude_args: >-
            --max-turns 10
            --permission-prompts none
